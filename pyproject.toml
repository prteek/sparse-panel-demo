[project]
name = "sparse-panel-modelling"
version = "0.1.0"
description = "Smooth levels from sparse, gappy panels (Beijing air quality): paper, shared library and Hugging Face artefacts"
requires-python = ">=3.13"
# the shared library (sparse_panel): data preparation, model, baselines and CV runs
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "tabulate>=0.9",
    "torch>=2.5",
]

[dependency-groups]
# the Gradio Space (huggingface/space)
app = [
    "gradio>=6.30.0",
    "huggingface-hub>=0.30",
    "plotly>=5.24",
]
# rendering the Quarto paper (paper/)
paper = [
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "seaborn>=0.13",
]
dev = ["pytest>=8"]

[tool.uv]
default-groups = ["app", "paper", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sparse_panel"]
