name: Publish dataset card

# Only the card is published from CI. The tables are rebuilt with huggingface/dataset/precompute.py and uploaded by
# hand (huggingface/publish.sh "message" dataset): refitting on a CI runner would change the published predictions
# in the last decimals.
on:
  push:
    branches: [main]
    paths:
      - huggingface/dataset/README.md
      - .github/workflows/publish-dataset.yml
  workflow_dispatch:

concurrency:
  group: publish-dataset
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_CLI: hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub==2.3.0
      - name: Upload the dataset card
        run: huggingface/publish.sh "Deploy ${GITHUB_SHA::7} from GitHub" dataset-card
